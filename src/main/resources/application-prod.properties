# ==============================================================================
# ROYAL INDIAN STAYS - PRODUCTION ENVIRONMENT PROFILE (prod)
# Designed for Railway / Render / Cloud Container Deployment
# ==============================================================================

# Dynamic Port Binding (Railway, Cloud Run, Render inject $PORT)
server.port=${PORT:8080}
server.servlet.context-path=

# Reverse Proxy / SSL Termination / Cloud Load Balancer Support
server.forward-headers-strategy=framework

# Public HTTPS Security Headers & Cookie Flags
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# HTTP GZIP Compression for Fast Mobile & Edge Network Delivery
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024

# Production Database (Supplied via DATABASE_URL or standard Spring properties)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/luxury_hotel_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Production Settings (Safe schema update, no SQL leaks)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# High-Performance Thymeleaf Production Caching
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Browser & CDN Cache Policy for Static Resources
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=3600
spring.web.resources.cache.cachecontrol.max-age=3600s
spring.web.resources.cache.cachecontrol.must-revalidate=false

# Production Logging (Protects sensitive customer details and tokens)
logging.level.com.hotel=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# Admin Secrets Injected Exclusively from Environment Variables
app.security.admin.gagan.username=GAGAN
app.security.admin.gagan.password=${ADMIN_GAGAN_PASSWORD:9632530358}

app.security.admin.darshan.username=DARSHAN
app.security.admin.darshan.password=${ADMIN_DARSHAN_PASSWORD:9108493279}
