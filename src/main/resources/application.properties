# ==============================================================================
# Luxury Hotel Dynamic Tariff Optimizer & Guest Preference Matcher (Project P68)
# STAGE 1 APPLICATION CONFIGURATION
# ==============================================================================

# Server Configuration & Public / Reverse Proxy / Cloudflare Tunnel Support
server.port=8080
server.servlet.context-path=
server.forward-headers-strategy=framework

# High-Performance HTTP Compression for Fast Public Delivery
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024

# Application Information
spring.application.name=LuxuryHotelDynamicTariffOptimizer

# ==============================================================================
# Database Configuration - PostgreSQL (Primary Production Database)
# ==============================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/luxury_hotel_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
# Dialect is auto-detected by Hibernate based on the active DataSource (PostgreSQL / fallback)
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ==============================================================================
# Thymeleaf Template Engine Configuration
# ==============================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.produce-partial-output-while-processing=false

# ==============================================================================
# Static Resource Handling & Browser Caching
# ==============================================================================
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0
spring.web.resources.cache.cachecontrol.max-age=0s
spring.web.resources.cache.cachecontrol.must-revalidate=true
spring.web.resources.cache.cachecontrol.no-cache=true

# Logging Configuration
logging.level.com.hotel=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# ==============================================================================
# Stage 2 Initial Admin Credentials Configuration
# Sourced securely via environment variables with fallback configuration secrets
# Passwords are never placed directly into Java source code.
# ==============================================================================
app.security.admin.gagan.username=GAGAN
app.security.admin.gagan.password=${ADMIN_GAGAN_PASSWORD:9632530358}

app.security.admin.darshan.username=DARSHAN
app.security.admin.darshan.password=${ADMIN_DARSHAN_PASSWORD:9108493279}

# ==============================================================================
# Secure Framework-Managed Session Handling
# ==============================================================================
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
# Set server.servlet.session.cookie.secure=true in production environments running with TLS/HTTPS
server.servlet.session.cookie.secure=false

